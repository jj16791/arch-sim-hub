- num: "01"
  title: "Interoperability"
  desc: "How separate tools can effectively compose to empower a researcher's simulation environment."
- num: "02"
  title: "Preserving quality once tools interoperate"
  desc: "Keeping a composed toolchain fast, trustworthy, usable and adaptable, rather than inheriting the worst of each part."
- num: "03"
  title: "Keeping simulators alive"
  desc: "What keeps an open-source simulator healthy over a decade, and what usually kills it."
- num: "04"
  title: "Trustworthy, comparable results across tools"
  desc: "Trusting simulation results and comparing them fairly between tools, as hardware and AI/ML-driven methods move fast."
- num: "05"
  title: "Building open-source collaboration that lasts"
  desc: "How a community governs shared efforts, aligns different priorities, and turns one-off contributions into a lasting ecosystem rather than fragmented, single-use tools."
- num: "06"
  title: "Learning from closed/proprietary tools"
  desc: "What practices from the closed world — maintenance, validation, interoperability, support — are worth adopting in open source."
